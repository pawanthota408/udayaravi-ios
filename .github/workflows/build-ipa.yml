name: Build iOS Debug IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Package .IPA
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload Debug .IPA Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: UdayaraviCreations-Debug-IPA
          path: "**/*.ipa"
          retention-days: 7
